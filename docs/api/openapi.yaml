openapi: 3.0.3
info:
  title: Strata API
  version: 0.1.0
  description: |
    REST API specification for Strata (MVP, software projects).
    Sources: [README section 6.2](../../README.md), [PRD section 6](../product/PRD_Strata_MVP.md).

    General conventions:
    - JSON payloads, UTF-8 encoded. Timestamps use ISO 8601 (UTC).
    - User requests authenticate with a session cookie after OIDC sign-in (GitHub, Google). JUnit uploads use a per-project CI token.
    - Every endpoint enforces permissions server-side with RBAC (PRD section 7). Access to objects in another workspace returns `404`.
    - Snapshots, events and gate_runs are immutable: no endpoint edits or deletes them (BR03, BR06, AC-F6-05).
    - Strata has no endpoint that returns source code or diffs (BR10).
    - Lists use cursor pagination: `?cursor=...&limit=...` (default 50, maximum 200).
  contact:
    name: Strata team
  license:
    name: See LICENSE
    url: ../../LICENSE

servers:
  - url: https://{host}/api/v1
    description: Deployment environment
    variables:
      host:
        default: localhost:8080

tags:
  - name: Auth
    description: OIDC sign-in (P01)
  - name: Workspace
    description: Workspace, members, invitations (P17)
  - name: Project
    description: Projects, sprints, CI tokens (P04, P07, P16)
  - name: Item
    description: Items, links, comments, backlog, board (P05–P08)
  - name: Notification
    description: In-app notifications (P03)
  - name: Integration
    description: GitHub App and webhooks (P15)
  - name: Evidence
    description: Test reports, snapshots (P11, P16)
  - name: Feature
    description: Feature profile, timeline, AC and traceability (P09, P10, P12)
  - name: Gate
    description: Gate rules, gate_run, approval (P13, P14)
  - name: Audit
    description: Event log (P18)

security:
  - cookieAuth: []

paths:
  # ---------------------------------------------------------------
  # Auth (P01)
  # ---------------------------------------------------------------
  /auth/login:
    get:
      tags: [Auth]
      summary: Redirect to the OIDC provider
      security: []
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [github, google]
        - name: returnTo
          in: query
          description: Internal path to return to after sign-in. External URLs are not accepted.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the provider's sign-in page
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/callback:
    get:
      tags: [Auth]
      summary: Handle the OIDC callback and create a session
      description: The first sign-in creates an `app_user` and asks the user to create or join a workspace (AC-F1-01).
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Session created; redirect to the home page or to the workspace join page
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [Auth]
      summary: Current user and effective permissions
      description: Effective permissions are the union of the roles held per project (AC-F2-01, BR04).
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------
  # Workspace and members (P17)
  # ---------------------------------------------------------------
  /workspaces:
    post:
      tags: [Workspace]
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreate"
      responses:
        "201":
          description: Workspace created; the creator becomes Workspace Admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /workspaces/{workspaceId}/invitations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [Workspace]
      summary: Invite a member by email or link
      description: Invitations are valid for 7 days (AC-F1-04). Only Workspace Admins may invite (PRD F1, section 2.5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /invitations/{token}/accept:
    post:
      tags: [Workspace]
      summary: Accept an invitation
      description: Returns `410` if the invitation is older than 7 days, has been revoked or has already been used (AC-F1-04). No membership is created in those cases.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Joined the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"

  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Workspace]
      summary: List members and their roles
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Membership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      tags: [Workspace]
      summary: Assign roles to members per project
      description: |
        Every change writes a `role_assignment.changed` event with actor, before and after (AC-F2-03, BR13).
        Returns `409` when the operation would remove the last Admin (AC-F2-04).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items:
                    $ref: "#/components/schemas/RoleAssignment"
      responses:
        "200":
          description: Roles updated
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  # ---------------------------------------------------------------
  # Projects, sprints, CI tokens (P04, P07, P16)
  # ---------------------------------------------------------------
  /projects:
    get:
      tags: [Project]
      summary: List projects in the workspace
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Project]
      summary: Create a project
      description: The `key` is 2–6 uppercase characters, unique within the workspace (US04). `kind` is fixed to `software` in the MVP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{projectKey}/sprints:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [Project]
      summary: List sprints of a project
      responses:
        "200":
          description: List of sprints
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sprint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Project]
      summary: Create a sprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SprintCreate"
      responses:
        "201":
          description: Sprint created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sprint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sprints/{sprintId}:
    parameters:
      - $ref: "#/components/parameters/SprintId"
    patch:
      tags: [Project]
      summary: Edit a sprint (name, start date, end date)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SprintPatch"
      responses:
        "200":
          description: Sprint updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sprint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectKey}/ci-tokens:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [Project]
      summary: List CI tokens of a project (token values are not returned)
      responses:
        "200":
          description: List of tokens
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CiToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Project]
      summary: Create a CI token
      description: |
        The token value is returned only once in the response. Tokens are stored encrypted and have minimum permissions, limited to uploading test reports (BR12).
        Tokens are not tied to a personal account (PRD section 2.5.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CiTokenCreate"
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiTokenCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ci-tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [Project]
      summary: Revoke a CI token
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------
  # Items, links, comments, backlog (P05–P08)
  # ---------------------------------------------------------------
  /projects/{projectKey}/items:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [Item]
      summary: List items of a project (backlog, board)
      parameters:
        - name: type
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ItemType"
          style: form
          explode: false
        - name: state
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ItemState"
          style: form
          explode: false
        - name: sprintId
          in: query
          schema:
            type: string
            format: uuid
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
        - name: featureId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List of items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Item]
      summary: Create an item
      description: |
        The item code `KEY-n` is incremented atomically and is not reused after deletion (BR02, AC-F3-01).
        A bug must have a `severity` of S1–S4; if it is missing, the response is `400` (AC-F3-03). This rule is enforced in the application layer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemCreate"
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [Item]
      summary: Item details (used by the drawer)
      responses:
        "200":
          description: Item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Item]
      summary: Edit an item
      description: The `state` cannot be changed through this endpoint; use `/items/{itemId}/transitions`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemPatch"
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Item]
      summary: Soft-delete an item
      description: Writes an event; a PM can restore the item within 30 days (AC-F3-04).
      responses:
        "204":
          description: Item soft-deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{itemId}/restore:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [Item]
      summary: Restore a soft-deleted item (within 30 days)
      responses:
        "200":
          description: Item restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /items/{itemId}/transitions:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [Item]
      summary: Change status according to the lifecycle
      description: |
        Default lifecycle: `backlog → in_progress → review → done`, plus `cancelled`.
        An out-of-lifecycle change (for example `backlog → done`) is refused with `409` (AC-F3-02).

        The `review → done` transition triggers the gate on the latest snapshot (UC12, F8):
        - `pass`: the item moves to `done`.
        - `needs_review`: the item stays in `review` and waits for QA in the gate queue.
        - `fail`: the item returns to `in_progress` with the reason in `gateRun`.

        The person requesting a transition may not approve their own gate (BR08, AC-F8-05).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
      responses:
        "200":
          description: Status changed (including the gate result, if any)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /items/{itemId}/links:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [Item]
      summary: List links of an item (item ↔ item and item ↔ artifact)
      responses:
        "200":
          description: List of links
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Link"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Item]
      summary: Create a manual link
      description: |
        Used for item ↔ item (`parent_of`, `blocks`, `relates_to`, `implements`, `tests`, `duplicates`)
        and item ↔ artifact links (`source = manual`, US16, UC03).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkCreate"
      responses:
        "201":
          description: Link created; event written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /links/{linkId}:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    delete:
      tags: [Item]
      summary: Remove a link
      description: |
        Removes an automatic link that was wrong; the link is not recreated automatically for the same pair (AC-F5-05).
        Writes an event with the actor.
      responses:
        "204":
          description: Link removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{itemId}/comments:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [Item]
      summary: List comments on an item
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Item]
      summary: Add a comment (Markdown, with @mentions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreate"
      responses:
        "201":
          description: Comment created; mentioned people are notified within 10 seconds (AC-F4-01)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    patch:
      tags: [Item]
      summary: Edit a comment or mark it as a Decision
      description: Edits keep their history in events (AC-F4-02). Marking `isDecision` makes it appear in the profile and timeline (AC-F4-04).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentPatch"
      responses:
        "200":
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectKey}/backlog/order:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    put:
      tags: [Item]
      summary: Save the backlog order after drag-and-drop
      description: The order is saved and other people see it within 2 seconds (AC-F3-05).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds:
                  type: array
                  description: Items in the new order, from top to bottom.
                  items:
                    type: string
                    format: uuid
      responses:
        "204":
          description: Order saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------
  # Notifications (P03)
  # ---------------------------------------------------------------
  /notifications:
    get:
      tags: [Notification]
      summary: Notifications of the current user
      parameters:
        - name: unread
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/{notificationId}:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    patch:
      tags: [Notification]
      summary: Mark as read or unread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------
  # GitHub integration (P15)
  # ---------------------------------------------------------------
  /integrations/github/installations:
    post:
      tags: [Integration]
      summary: Record a GitHub App installation for a repo and attach it to a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubInstallationCreate"
      responses:
        "201":
          description: Repo attached to the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubInstallation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /integrations/github/status:
    get:
      tags: [Integration]
      summary: GitHub integration health
      description: Returns `degraded` when webhooks fail, while waiting for polling to compensate (section 2.5.2, section 4.7).
      parameters:
        - name: projectKey
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ProjectKey"
      responses:
        "200":
          description: Integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubIntegrationStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /integrations/github/unlinked:
    get:
      tags: [Integration]
      summary: Commits and PRs not attached to an item
      description: List for manual linking (UC06 alternative flow, section 4.6).
      parameters:
        - name: projectKey
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ProjectKey"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List of unlinked artifacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /webhooks/github:
    post:
      tags: [Integration]
      summary: Receive GitHub App webhooks
      description: |
        Events: `push`, `pull_request`, `check_run`, `workflow_run` (AC-F5).

        Flow (UC06): verify HMAC → check the delivery id → write a job → return `202`.
        A delivery that was already processed returns `200` and is skipped (AC-F5-02). A wrong signature returns `401` (AC-F5-03).
        A lost webhook is compensated by polling within 15 minutes (AC-F5-04).
      security: []
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
            enum: [push, pull_request, check_run, workflow_run]
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: Delivery id, used as `external_ref` for idempotency (BR05).
          schema:
            type: string
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: HMAC-SHA256 signature of the request body.
          schema:
            type: string
            pattern: "^sha256=[0-9a-f]{64}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Original GitHub payload; only metadata is read.
      responses:
        "200":
          description: Delivery was already processed; skipped
        "202":
          description: Received and queued for processing
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  # ---------------------------------------------------------------
  # Test reports and snapshots (P11, P16)
  # ---------------------------------------------------------------
  /projects/{projectKey}/test-reports:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      tags: [Evidence]
      summary: Upload JUnit XML and create a snapshot
      description: |
        Uses a project CI token (not a personal account). Maximum 20 MB (AC-F6-04, `413`).

        The immutable snapshot is tied to the commit SHA, run id and file hash (AC-F6-01).
        Re-sending the same (SHA, run id, hash) does not create a second snapshot; it returns `200` with the existing one (AC-F6-02).
        Broken XML returns `422` with the reason and creates no snapshot (AC-F6-03).
        There is no endpoint to edit or delete snapshots (AC-F6-05).
      security:
        - ciToken: []
      parameters:
        - name: X-Commit-Sha
          in: header
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{40}$"
        - name: X-Run-Id
          in: header
          required: true
          description: CI run identifier.
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
              description: JUnit XML content (`testsuite` / `testcase`).
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: A snapshot with the same (SHA, run id, hash) already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "201":
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /snapshots/{snapshotId}:
    parameters:
      - $ref: "#/components/parameters/SnapshotId"
    get:
      tags: [Evidence]
      summary: Snapshot summary
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /snapshots/{snapshotId}/tests:
    parameters:
      - $ref: "#/components/parameters/SnapshotId"
    get:
      tags: [Evidence]
      summary: Result of each test in the snapshot
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TestStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List of test results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResultPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------
  # Feature profile, timeline (P09, P10)
  # ---------------------------------------------------------------
  /features/{featureId}/dossier:
    parameters:
      - $ref: "#/components/parameters/FeatureId"
    get:
      tags: [Feature]
      summary: Feature profile (summary, AC, child items, PR/CI, latest tests, decisions)
      description: |
        Loads within 2 seconds at p95 with 500 events (AC-F7-01). PRs and commits carry metadata only, no diffs (AC-F7-03).
        A feature with no tests returns `latestSnapshot: null`; the UI shows "no results yet" (UC08).
      responses:
        "200":
          description: Feature profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dossier"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /features/{featureId}/timeline:
    parameters:
      - $ref: "#/components/parameters/FeatureId"
    get:
      tags: [Feature]
      summary: Timeline of the feature and its descendants
      parameters:
        - name: category
          in: query
          description: Filter by event category (AC-F7-04).
          schema:
            $ref: "#/components/schemas/TimelineCategory"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Events in descending chronological order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------
  # AC and traceability (P12)
  # ---------------------------------------------------------------
  /features/{featureId}/acs:
    parameters:
      - $ref: "#/components/parameters/FeatureId"
    get:
      tags: [Feature]
      summary: List the AC of a feature
      responses:
        "200":
          description: List of AC
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AcceptanceCriterion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Feature]
      summary: Add an AC with a stable ID
      description: IDs take the form `KEY-n/AC-m` and do not change after creation (US25, F9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptanceCriterionCreate"
      responses:
        "201":
          description: AC created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptanceCriterion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /acs/{acId}:
    parameters:
      - $ref: "#/components/parameters/AcId"
    patch:
      tags: [Feature]
      summary: Edit the content of an AC
      description: |
        Changing the content of an AC marks all of its test links as `stale` until QA confirms (AC-F9-03, BR14).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptanceCriterionPatch"
      responses:
        "200":
          description: AC updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptanceCriterion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /acs/{acId}/test-links:
    parameters:
      - $ref: "#/components/parameters/AcId"
    put:
      tags: [Feature]
      summary: Set or update manual AC ↔ test links
      description: |
        Created automatically from the `AC:KEY-n/AC-m` tag in a test name or classname (F9). This endpoint is also used by QA to confirm `stale` links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [testIds]
              properties:
                testIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Links updated
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AcTestLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /features/{featureId}/traceability:
    parameters:
      - $ref: "#/components/parameters/FeatureId"
    get:
      tags: [Feature]
      summary: Matrix of AC × tests × latest snapshot results
      description: Coverage = AC with tests / total AC (AC-F9-02).
      responses:
        "200":
          description: Traceability matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Traceability"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------
  # Gate rules and gate_run (P13, P14)
  # ---------------------------------------------------------------
  /projects/{projectKey}/gate-rules:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [Gate]
      summary: Current gate rule of the project
      responses:
        "200":
          description: Current gate rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Gate]
      summary: Edit the gate rule (creates a new version)
      description: |
        Rules are versioned data. Each save creates a new version; old `gate_run` records keep their old version (AC-F8-04, BR09).
        Pass `preview=true` to evaluate the rule on the latest snapshot without saving a version (P13).
      parameters:
        - name: preview
          in: query
          description: Evaluate only on the latest snapshot, without saving a version.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateRuleUpdate"
      responses:
        "200":
          description: Rule saved, or preview result when `preview=true`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /features/{featureId}/gate-runs:
    parameters:
      - $ref: "#/components/parameters/FeatureId"
    get:
      tags: [Gate]
      summary: Gate run history of the feature
      responses:
        "200":
          description: List of gate_runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GateRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Gate]
      summary: Run the gate on the latest snapshot
      description: |
        The gate evaluates the latest snapshot, not the current branch (BR06). With no snapshot, the result is `fail` with the reason "missing evidence" (UC12).
        The result is immutable and records the snapshot and rule version (BR09). The same snapshot and rule give the same result (AC-F8-03).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "201":
          description: gate_run saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /gate-runs:
    get:
      tags: [Gate]
      summary: Gate review queue (P14)
      parameters:
        - name: result
          in: query
          schema:
            type: string
            enum: [needs_review, pass, fail]
            default: needs_review
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List of gate_runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GateRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /gate-runs/{gateRunId}/decision:
    parameters:
      - $ref: "#/components/parameters/GateRunId"
    post:
      tags: [Gate]
      summary: QA accepts or rejects a `needs_review` gate
      description: |
        Accept → `pass`; the item moves to `done`. Reject → `fail`; the item returns to `in_progress` (UC12).
        A reason is mandatory (US24). The person who requested the move to `done` may not approve their own gate (BR08, AC-F8-05) → `403`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateDecisionRequest"
      responses:
        "200":
          description: Decision recorded; gate_run updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ---------------------------------------------------------------
  # Event log (P18)
  # ---------------------------------------------------------------
  /events:
    get:
      tags: [Audit]
      summary: Workspace event log (Admin and PM only)
      description: Events are append-only; no endpoint edits or deletes them (BR03, PRD section 7).
      parameters:
        - name: projectKey
          in: query
          schema:
            $ref: "#/components/schemas/ProjectKey"
        - name: type
          in: query
          schema:
            type: string
          description: For example `role_assignment.changed`.
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: strata_session
      description: Session cookie issued after OIDC sign-in.
    ciToken:
      type: http
      scheme: bearer
      description: Per-project CI token with minimum permissions, limited to uploading test reports (BR12).

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectKey:
      name: projectKey
      in: path
      required: true
      description: Project key of 2–6 uppercase characters.
      schema:
        $ref: "#/components/schemas/ProjectKey"
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SprintId:
      name: sprintId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeatureId:
      name: featureId
      in: path
      required: true
      description: Id of an item of type `feature` (the anchor of the F7 profile).
      schema:
        type: string
        format: uuid
    AcId:
      name: acId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GateRunId:
      name: gateRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    BadRequest:
      description: Invalid data or a required field is missing (for example a bug without severity, AC-F3-03)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not signed in, session expired, or invalid signature/token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions. The message states which role is required (section 4.7)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Does not exist, or belongs to another workspace (AC-F1-02)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: State conflict or business rule violation (lifecycle, duplicate code, removing the last Admin)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: Resource expired (invitation older than 7 days)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: File or request body exceeds the limit (20 MB for JUnit, AC-F6-04)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Syntactically valid content that cannot be processed, for example broken XML (AC-F6-03)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code, for example `INVALID_TRANSITION`, `NOT_FOUND`, `XML_INVALID`.
          example: INVALID_TRANSITION
        message:
          type: string
          description: Message for the user, including the reason.
        details:
          type: object
          additionalProperties: true

    ProjectKey:
      type: string
      pattern: "^[A-Z]{2,6}$"
      example: KEY

    ItemType:
      type: string
      enum: [epic, story, task, bug, feature]

    ItemState:
      type: string
      enum: [backlog, in_progress, review, done, cancelled]

    Severity:
      type: string
      enum: [S1, S2, S3, S4]

    Role:
      type: string
      enum: [workspace_admin, po, pm, ba, qa, dev, viewer]

    LinkType:
      type: string
      enum: [parent_of, blocks, relates_to, implements, tests, duplicates]

    LinkOrigin:
      type: string
      enum: [auto, manual, poll]

    GateResult:
      type: string
      enum: [pass, fail, needs_review]

    TestStatus:
      type: string
      enum: [pass, fail, skip]

    TimelineCategory:
      type: string
      enum: [state, code, test, comment, decision]

    Me:
      type: object
      required: [id, email, workspaces]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        workspaces:
          type: array
          items:
            type: object
            required: [id, name, roles]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              roles:
                type: array
                description: Workspace-wide role (Workspace Admin) and per-project roles.
                items:
                  $ref: "#/components/schemas/Role"

    Workspace:
      type: object
      required: [id, name, dataLocation]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        dataLocation:
          type: string
          description: Where the data is stored (`TENANT.data_location`).
        createdAt:
          type: string
          format: date-time

    WorkspaceCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    InvitationCreate:
      type: object
      required: [roles]
      properties:
        email:
          type: string
          format: email
          description: Leave empty to create a link invitation.
        roles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Role"

    Invitation:
      type: object
      required: [id, status, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        link:
          type: string
          format: uri
          description: Only present when a link invitation is created.
        status:
          type: string
          enum: [pending, accepted, expired, revoked]
        expiresAt:
          type: string
          format: date-time

    Membership:
      type: object
      required: [userId, roles]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    RoleAssignment:
      type: object
      required: [userId, projectId, roles]
      properties:
        userId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    Project:
      type: object
      required: [id, key, name, kind]
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/ProjectKey"
        name:
          type: string
        kind:
          type: string
          enum: [software]
          description: Fixed to `software` in the MVP.
        createdAt:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required: [key, name]
      properties:
        key:
          $ref: "#/components/schemas/ProjectKey"
        name:
          type: string
          minLength: 1
          maxLength: 120

    ProjectPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        nextCursor:
          type: string
          nullable: true

    Sprint:
      type: object
      required: [id, projectId, name, startDate, endDate]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    SprintCreate:
      type: object
      required: [name, startDate, endDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    SprintPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    CiToken:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true

    CiTokenCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80

    CiTokenCreated:
      allOf:
        - $ref: "#/components/schemas/CiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Returned only once; never stored in plain text on the server.

    Item:
      type: object
      required: [id, key, projectId, type, state, title, rank]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          pattern: "^[A-Z]{2,6}-[0-9]+$"
          description: The `KEY-n` code, stable (BR02).
          example: KEY-12
        projectId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ItemType"
        state:
          $ref: "#/components/schemas/ItemState"
        title:
          type: string
        description:
          type: string
          description: Markdown.
        severity:
          allOf:
            - $ref: "#/components/schemas/Severity"
          nullable: true
          description: Required when `type = bug`.
        assigneeId:
          type: string
          format: uuid
          nullable: true
        sprintId:
          type: string
          format: uuid
          nullable: true
        featureId:
          type: string
          format: uuid
          nullable: true
          description: The feature (an item of type `feature`) this item belongs to.
        rank:
          type: number
          description: Backlog order.
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ItemCreate:
      type: object
      required: [type, title]
      properties:
        type:
          $ref: "#/components/schemas/ItemType"
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        assigneeId:
          type: string
          format: uuid
        sprintId:
          type: string
          format: uuid
        featureId:
          type: string
          format: uuid

    ItemPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        assigneeId:
          type: string
          format: uuid
          nullable: true
        sprintId:
          type: string
          format: uuid
          nullable: true
        featureId:
          type: string
          format: uuid
          nullable: true

    ItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        nextCursor:
          type: string
          nullable: true

    TransitionRequest:
      type: object
      required: [to]
      properties:
        to:
          $ref: "#/components/schemas/ItemState"
        reason:
          type: string
          description: Required when rejecting or cancelling.

    TransitionResult:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/Item"
        gateRun:
          allOf:
            - $ref: "#/components/schemas/GateRun"
          nullable: true
          description: Present when moving `review → done`.

    Link:
      type: object
      required: [id, type, fromId, toId, origin]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/LinkType"
        fromId:
          type: string
          format: uuid
        toId:
          type: string
          format: uuid
          description: Id of an item or an artifact.
        toKind:
          type: string
          enum: [item, artifact]
        origin:
          $ref: "#/components/schemas/LinkOrigin"
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time

    LinkCreate:
      type: object
      required: [type, toId]
      properties:
        type:
          $ref: "#/components/schemas/LinkType"
        toId:
          type: string
          format: uuid
        toKind:
          type: string
          enum: [item, artifact]
          default: item

    Comment:
      type: object
      required: [id, itemId, authorId, body, isDecision, createdAt]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        body:
          type: string
          description: Markdown.
        mentions:
          type: array
          items:
            type: string
            format: uuid
        isDecision:
          type: boolean
        editedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    CommentCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
        isDecision:
          type: boolean
          default: false

    CommentPatch:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
        isDecision:
          type: boolean

    CommentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        nextCursor:
          type: string
          nullable: true

    Notification:
      type: object
      required: [id, type, read, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: mention
        title:
          type: string
        link:
          type: string
          description: Internal path to the item or comment.
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type: string
          nullable: true

    GithubInstallation:
      type: object
      required: [id, projectId, repoFullName, status]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        repoFullName:
          type: string
          example: owner/repo
        status:
          type: string
          enum: [connected, degraded, revoked]

    GithubInstallationCreate:
      type: object
      required: [installationId, repoFullName, projectKey]
      properties:
        installationId:
          type: integer
          format: int64
        repoFullName:
          type: string
          example: owner/repo
        projectKey:
          $ref: "#/components/schemas/ProjectKey"

    GithubIntegrationStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [connected, degraded, revoked]
        lastWebhookAt:
          type: string
          format: date-time
          nullable: true
        lastPollAt:
          type: string
          format: date-time
          nullable: true

    Artifact:
      type: object
      required: [id, type, externalRef, linked]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [commit, pull_request, ci_run]
        externalRef:
          type: string
          description: Idempotency key (delivery id, SHA, run id).
        title:
          type: string
          description: Commit or PR title. No diff.
        status:
          type: string
          description: PR or CI status.
        author:
          type: string
        url:
          type: string
          format: uri
        linked:
          type: boolean
        linkOrigin:
          $ref: "#/components/schemas/LinkOrigin"
          nullable: true

    ArtifactPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        nextCursor:
          type: string
          nullable: true

    Snapshot:
      type: object
      required: [id, commitSha, runId, fileHash, total, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        commitSha:
          type: string
          pattern: "^[0-9a-f]{40}$"
        runId:
          type: string
        fileHash:
          type: string
          description: SHA-256 of the original file.
        objectRef:
          type: string
          description: Reference in object storage. Not a public URL.
        total:
          type: object
          required: [pass, fail, skip]
          properties:
            pass:
              type: integer
              minimum: 0
            fail:
              type: integer
              minimum: 0
            skip:
              type: integer
              minimum: 0
            durationMs:
              type: integer
              minimum: 0
        createdAt:
          type: string
          format: date-time

    TestResult:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        classname:
          type: string
        status:
          $ref: "#/components/schemas/TestStatus"
        durationMs:
          type: integer
          minimum: 0
        message:
          type: string
          description: Error message (truncated to 2000 characters).
        acTags:
          type: array
          description: `AC:KEY-n/AC-m` tags read from the name or classname.
          items:
            type: string

    TestResultPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TestResult"
        nextCursor:
          type: string
          nullable: true

    Event:
      type: object
      required: [id, type, actorId, at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: role_assignment.changed
        actorId:
          type: string
          format: uuid
          nullable: true
        itemId:
          type: string
          format: uuid
          nullable: true
        category:
          $ref: "#/components/schemas/TimelineCategory"
        payload:
          type: object
          description: Before and after values, where applicable. Contains no diffs or source code.
          additionalProperties: true
        at:
          type: string
          format: date-time

    EventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        nextCursor:
          type: string
          nullable: true

    Dossier:
      type: object
      required: [feature, acs, children, artifacts]
      properties:
        feature:
          $ref: "#/components/schemas/Item"
        gateStatus:
          allOf:
            - $ref: "#/components/schemas/GateResult"
          nullable: true
          description: Result of the most recent gate.
        acs:
          type: array
          items:
            $ref: "#/components/schemas/AcceptanceCriterion"
        children:
          type: array
          description: Child items (stories, tasks, bugs).
          items:
            $ref: "#/components/schemas/Item"
        artifacts:
          type: array
          description: Linked commits and PRs, metadata only.
          items:
            $ref: "#/components/schemas/Artifact"
        latestSnapshot:
          allOf:
            - $ref: "#/components/schemas/Snapshot"
          nullable: true
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/Comment"

    AcceptanceCriterion:
      type: object
      required: [id, code, featureId, text, coverage]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[A-Z]{2,6}-[0-9]+/AC-[0-9]+$"
          example: KEY-5/AC-3
        featureId:
          type: string
          format: uuid
        text:
          type: string
          description: Given/When/Then or a description.
        coverage:
          type: string
          enum: [verified, uncovered, stale]
          description: Verified (passing in the latest snapshot), uncovered, or stale.
        snapshotId:
          type: string
          format: uuid
          nullable: true
          description: Snapshot used as evidence.

    AcceptanceCriterionCreate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000

    AcceptanceCriterionPatch:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000

    AcTestLink:
      type: object
      required: [acId, testId, status]
      properties:
        acId:
          type: string
          format: uuid
        testId:
          type: string
          format: uuid
        origin:
          type: string
          enum: [tag, manual]
        status:
          type: string
          enum: [active, stale]

    Traceability:
      type: object
      required: [snapshotId, coverage, rows]
      properties:
        snapshotId:
          type: string
          format: uuid
          nullable: true
        coverage:
          type: object
          description: Share of AC that have tests.
          required: [covered, total]
          properties:
            covered:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        rows:
          type: array
          items:
            type: object
            required: [acCode, result]
            properties:
              acCode:
                type: string
              test:
                type: string
              result:
                type: string
                enum: [pass, fail, skip, uncovered]
              link:
                type: string
                enum: [active, stale]
                nullable: true
              snapshotId:
                type: string
                format: uuid
                nullable: true

    GateCondition:
      type: object
      required: [expr]
      properties:
        id:
          type: string
        expr:
          type: string
          description: Condition expressed as data, for example `tests.failed == 0` or `tests.passed_ratio >= 0.95`.
          example: tests.failed == 0
        requiresReview:
          type: boolean
          default: false
          description: If it passes but needs human approval, the result is `needs_review`.

    GateRule:
      type: object
      required: [projectId, version, conditions]
      properties:
        projectId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/GateCondition"
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        preview:
          type: object
          description: Preview result when `preview=true`.
          additionalProperties: true

    GateRuleUpdate:
      type: object
      required: [conditions]
      properties:
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/GateCondition"

    GateRun:
      type: object
      required: [id, itemId, ruleVersion, snapshotId, result, evaluatedAt]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        ruleVersion:
          type: integer
          minimum: 1
          description: Rule version at the time of the run (BR09).
        snapshotId:
          type: string
          format: uuid
          nullable: true
          description: Null when evidence is missing; the result is then `fail`.
        result:
          $ref: "#/components/schemas/GateResult"
        failures:
          type: array
          description: Conditions that were not met, for example the list of failing tests (AC-F8-01).
          items:
            type: object
            required: [expr, reason]
            properties:
              expr:
                type: string
              reason:
                type: string
              testIds:
                type: array
                items:
                  type: string
                  format: uuid
        requestedBy:
          type: string
          format: uuid
        reviewerId:
          type: string
          format: uuid
          nullable: true
        decisionReason:
          type: string
          nullable: true
        evaluatedAt:
          type: string
          format: date-time

    GateDecisionRequest:
      type: object
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [accept, reject]
        reason:
          type: string
          minLength: 1
          maxLength: 1000
